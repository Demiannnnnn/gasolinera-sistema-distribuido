
services:
  
   # --- bases de datos ---
  
  # db para la empresa independiente capa 3 
  db_empresa:
    image: postgres:15-alpine
    container_name: db_empresa
    restart: unless-stopped
    env_file:
      - ./.env 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5435:5432" # Expuesto al host
    volumes:
      - db_empresa_data:/var/lib/postgresql/data
      - ./db/db_empresa.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # DB Local para Distribuidor 1
  db_distribuidor1:
    image: postgres:15-alpine
    container_name: db_distribuidor_1
    restart: unless-stopped
    env_file:
      - ./.env 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_distribuidor_1
    volumes:
      - db_distribuidor1_data:/var/lib/postgresql/data
      - ./db/db_distribuidor_1.sql:/docker-entrypoint-initdb.d/init.sql:ro

  #  DB Local para Distribuidor 2
  db_distribuidor2:
    image: postgres:15-alpine
    container_name: db_distribuidor_2
    restart: unless-stopped
    env_file:
      - ./.env 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_distribuidor_2
    volumes:
      - db_distribuidor2_data:/var/lib/postgresql/data
      - ./db/db_distribuidor_2.sql:/docker-entrypoint-initdb.d/init.sql:ro

  #  DB Local para Distribuidor 3
  db_distribuidor3:
    image: postgres:15-alpine
    container_name: db_distribuidor_3
    restart: unless-stopped
    env_file:
      - ./.env 
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_distribuidor_3
    volumes:
      - db_distribuidor3_data:/var/lib/postgresql/data
      - ./db/db_distribuidor_3.sql:/docker-entrypoint-initdb.d/init.sql:ro

  # === BACK ENDS ===

  # Backend Empresa (Nivel 3)
  empresa:
    build:
      context: ./backend/empresa
      dockerfile: Dockerfile
    container_name: empresa
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8081:8081"
    environment:
      # Conexión a su propia DB
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_empresa:5432/db_empresa?sslmode=disable"
      DISTRIBUIDOR_1_HOST: "distribuidor1:8081"
      DISTRIBUIDOR_2_HOST: "distribuidor2:8083"
      DISTRIBUIDOR_3_HOST: "distribuidor3:8084"
    depends_on:
      - db_empresa

  #  Backend Distribuidor 1 (Nivel 2)
  distribuidor1:
    build:
      context: ./backend/distribuidor
      dockerfile: Dockerfile
    container_name: distribuidor1
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8080:8080" # Puerto API
      - "9001:9001" # Puerto para Sockets de Surtidores
    environment:
      PORT: 8080
      SOCKET_PORT: 9001 # Puerto para Sockets de Surtidores
      DB_HOST_INTERNAL: "db_distribuidor1" 
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_distribuidor1:5432/db_distribuidor_1?sslmode=disable"
      EMPRESA_HOST: "${EMPRESA_HOST}"
      DISTRIBUIDOR_ID: "${DISTRIBUIDOR_1_ID}"
    depends_on:
      - db_distribuidor1
      - empresa

  #  Backend Distribuidor 2 (Nivel 2)
  distribuidor2:
    build:
      context: ./backend/distribuidor
      dockerfile: Dockerfile
    container_name: distribuidor2
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8083:8083" # Puerto API
      - "9002:9002" # Puerto para Sockets de Surtidores
    environment:
      PORT: 8083
      SOCKET_PORT: 9002 # Puerto para Sockets de Surtidores
      DB_HOST_INTERNAL: "db_distribuidor2" 
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_distribuidor2:5432/db_distribuidor_2?sslmode=disable"
      EMPRESA_HOST: "${EMPRESA_HOST}"
      DISTRIBUIDOR_ID: "${DISTRIBUIDOR_2_ID}"
    depends_on:
      - db_distribuidor2
      - empresa

  # 🚚 Backend Distribuidor 3 (Nivel 2)
  distribuidor3:
    build:
      context: ./backend/distribuidor
      dockerfile: Dockerfile
    container_name: distribuidor3
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8084:8084" # Puerto API
      - "9003:9003" # Puerto para Sockets de Surtidores
    environment:
      PORT: 8084
      SOCKET_PORT: 9003 # Puerto para Sockets de Surtidores
      DB_HOST_INTERNAL: "db_distribuidor3" 
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db_distribuidor3:5432/db_distribuidor_3?sslmode=disable"
      EMPRESA_HOST: "${EMPRESA_HOST}"
      DISTRIBUIDOR_ID: "${DISTRIBUIDOR_3_ID}"
    depends_on:
      - db_distribuidor3
      - empresa

  # === SIMULADORES DE SURTIDORES (NIVEL 1) ===

  surtidor-simulator-1:
    build:
      context: ./backend/surtidor-simulator
      dockerfile: Dockerfile
    container_name: surtidor-simulator-1
    restart: unless-stopped
    depends_on:
      - distribuidor1
    environment:
      DISTRIBUTOR_ADDRESS: "distribuidor1:9001"
      NUM_SURTIDORES: 8

  surtidor-simulator-2:
    build:
      context: ./backend/surtidor-simulator
      dockerfile: Dockerfile
    container_name: surtidor-simulator-2
    restart: unless-stopped
    depends_on:
      - distribuidor2
    environment:
      DISTRIBUTOR_ADDRESS: "distribuidor2:9002"
      NUM_SURTIDORES: 6

  surtidor-simulator-3:
    build:
      context: ./backend/surtidor-simulator
      dockerfile: Dockerfile
    container_name: surtidor-simulator-3
    restart: unless-stopped
    depends_on:
      - distribuidor3
    environment:
      DISTRIBUTOR_ADDRESS: "distribuidor3:9003"
      NUM_SURTIDORES: 10

  # === FRONT ENDS ===

  # 🖥️ Empresa UI
  empresa-ui:
    build:
      context: ./frontend/empresa-ui
      dockerfile: Dockerfile
    container_name: empresa-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/empresa-ui:/app
      - /app/node_modules
    environment:
      PORT: 3000
      REACT_APP_DIST1_URL: "http://localhost:8080"
      REACT_APP_DIST2_URL: "http://localhost:8083"
      REACT_APP_DIST3_URL: "http://localhost:8084"
    depends_on:
      - distribuidor1
      - distribuidor2
      - distribuidor3

  # 🖥️ Distribuidor UI
  distribuidor-ui:
    build:
      context: ./frontend/distribuidor-ui
      dockerfile: Dockerfile
    container_name: distribuidor-ui
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./frontend/distribuidor-ui:/app
      - /app/node_modules
    environment:
      PORT: 3001
      REACT_APP_API_URL: "http://localhost:8081"
    depends_on:
      - empresa

# Define los volúmenes para persistir los datos de cada DB
volumes:
  db_empresa_data:
  db_distribuidor1_data:
  db_distribuidor2_data:
  db_distribuidor3_data: