name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend Go (${{ matrix.servicio }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        servicio: [distribuidor, empresa]
    defaults:
      run:
        working-directory: backend/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/${{ matrix.servicio }}/go.mod
          cache-dependency-path: backend/${{ matrix.servicio }}/go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Tests
        run: go test -race -count=1 -v ./...

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [distribuidor-ui, empresa-ui, surtidor-ui]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tests
        run: npx react-scripts test --watchAll=false
      - name: Build
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build de imágenes
        run: |
          docker build -t distribuidor backend/distribuidor
          docker build -t empresa backend/empresa
